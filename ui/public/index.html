<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Files</title>
<link rel="stylesheet" href="/main.css">
<script type="module" src="/main.js"></script>
</head>
<body>
<div id="app">
  <header>
    <div class="top">
      <span class="dot" id="dot"></span>
      <span class="badge" id="mode">…</span>
      <span class="title" id="title">connecting…</span>
      <button class="chip" id="update" aria-haspopup="menu" aria-expanded="false"></button>
      <button class="icon" id="terminal-recovery" title="Terminal checkpoints and recovery" aria-label="Terminal checkpoints and recovery">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4a5.5 5.5 0 1 1-1 6M1.5 1.5V5H5M8 4.5V8l2 1.5"/></svg></button>
      <button class="icon" id="find-session" title="Find terminal session (⌘⇧O · /f for open sessions)" aria-label="Find terminal session">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="9" height="7" rx="1"/><path d="M5 12.5h9v-7M4 5l2 1.5-2 1.5"/></svg></button>
      <button class="icon" id="new-file" title="New File (⌥N)">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 1.5h5l3 3v4M3.5 1.5v13h5M8.5 1.5v3h3M12 10.5v5M9.5 13h5"/></svg></button>
      <button class="icon" id="new-folder" title="New Folder (⌥⇧N)">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 3.5h4l1.5 1.5h7.5v4M1.5 3.5v9.5h7M12 9.5v5M9.5 12h5"/></svg></button>
      <button class="icon" id="hidden" title="Hide dotfiles">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg></button>
      <button class="icon" id="expand" title="Expand all folders (⌥→ on a folder)">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 3l4 3 4-3M4 10l4 3 4-3"/></svg></button>
      <button class="icon" id="collapse" title="Collapse all folders (⌥← on a folder)">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6l4-3 4 3M4 13l4-3 4 3"/></svg></button>
      <button class="icon" id="refresh" title="Re-read folders and files">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg></button>
    </div>
    <div class="crumbs" id="crumbs"></div>
    <div class="note" id="note"></div>
    <input class="filter" id="filter" placeholder="Filter by name…   ( / )" spellcheck="false" autocomplete="off">
  </header>
  <div id="offer"></div>
  <div id="setup-notice" role="status" aria-live="polite"></div>
  <div id="notice"></div>
  <div id="empty"></div>
  <div id="tree" tabindex="0"></div>
  <div id="splitter" title="Drag to resize · double-click to reset"></div>
  <div id="viewer">
    <div id="pathbar"></div>
    <div class="vbar">
      <div id="tabs"></div>
      <div id="tools"></div>
      <button class="icon" id="maximize" title="Maximize viewer">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
    </div>
    <div id="vbody"></div>
  </div>
</div>
<div id="toast"></div>
<dialog id="recovery-dialog" aria-labelledby="recovery-heading">
  <div class="recovery-top"><h2 id="recovery-heading">Terminal recovery</h2><button id="recovery-close" aria-label="Close terminal recovery">Close</button></div>
  <label><input type="checkbox" id="recovery-enabled"> Save and restore terminals automatically</label>
  <p>Restore creates shells and supported connections. Previous applications are not restarted. iTerm2, shell and SSH startup configuration may run independently. Check authentication prompts in the restored panes.</p>
  <label for="recovery-history">Checkpoint</label>
  <select id="recovery-history" aria-label="Checkpoint"></select>
  <div class="recovery-actions"><button id="recovery-save">Save now</button><button id="recovery-restore">Restore</button></div>
  <div id="recovery-error" role="alert"></div><div id="recovery-report" role="status" aria-live="polite"></div>
</dialog>
</body>
</html>
