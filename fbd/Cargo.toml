[package]
name = "fbd"
version = "0.3.1"
edition = "2024"
authors = ["Gregory Zemskov <info@extractum.io>"]
description = "Backend of the iTerm2 File Browser panel: listings, file operations, workspaces, SSE"
license = "AGPL-3.0-only OR LicenseRef-Commercial"
publish = false

[dependencies]
axum = "0.8"
futures-util = "0.3.34"
libc = "0.2.189"
mime_guess = "2.0.5"
notify = "8"
parking_lot = "0.12.5"
rand = "0.9"
rust-embed = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trash = "5"
