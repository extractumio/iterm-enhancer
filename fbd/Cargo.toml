[package]
name = "fbd"
version = "0.3.1"
edition = "2024"
authors = ["Gregory Zemskov <info@extractum.io>"]
description = "Backend of the iterm-enhancer Files panel: listings, file operations, workspaces, events"
license = "AGPL-3.0-only OR LicenseRef-Commercial"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }  # panels take events over a WebSocket: WebKit gives all web views 6 HTTP connections (AC-41)
futures-util = "0.3.34"
# client side of the remote agent proxy (AC-37); already in the tree through axum
http-body-util = "0.1.5"
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
percent-encoding = "2.3.2"  # the host of an <img>'s request (AC-37); already in the tree
libc = "0.2.189"
mime_guess = "2.0.5"
notify = "8"
parking_lot = "0.12.5"
rand = "0.9"
rust-embed = "8"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"  # the panel's proof that it talks to fbd (AC-07); already in the tree through rust-embed
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trash = "5"
