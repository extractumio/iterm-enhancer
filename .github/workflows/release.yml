name: release

# A tag v* tests and builds the Linux helpers on the owner's runner (AC-39), read-only:
# code that runs here can never change a release. `make release TAG=…` on the Mac
# publishes the signed package users install (it carries all helpers, AC-40). No
# pull-request trigger (public repository); no write permission and no token for the GitHub API.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  test:
    name: Tests on Linux
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Tests
        run: |
          (cd ui && npm ci --ignore-scripts --no-fund --no-audit && npm run build && npx tsc -p . && npm test)
          (cd fbd && cargo test --locked)
          python3 -m unittest discover -s bridge/tests

  agents:
    name: Linux agents build
    needs: test
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The tag is on main
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "not a v* tag: $GITHUB_REF"; exit 1;; esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build the Linux agents
        run: |
          (cd ui && npm ci --ignore-scripts --no-fund --no-audit && npm run build)
          python3 scripts/agents.py toolchain linux-x86_64 linux-aarch64
          python3 scripts/agents.py build linux-x86_64 linux-aarch64
          aid=$(python3 scripts/agents.py id)
          for p in linux-x86_64 linux-aarch64; do sha256sum "dist/agents/$aid/$p/fbd"; done
